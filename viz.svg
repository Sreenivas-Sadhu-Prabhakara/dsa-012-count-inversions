<text x="56.0" y="197.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Recursion sorts the halves: [2,3,5] and [1,4] (counting 3 inversions inside the</text>
<text x="56.0" y="216.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">left, 1 inside the right). Now merge: when 1 is placed before the left half, it is</text>
